<!DOCTYPE html>
<html lang="{{ site.lang | default: 'de' }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title and page.url != '/' %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
<meta name="description" content="{{ page.beschreibung | default: site.description }}">
<style>
  :root {
    --grund: #ffffff;
    --schrift: #1a1d21;
    --gedaempft: #5b6570;
    --akzent: #c2410c;
    --linie: #e3e6ea;
    --kasten: #f6f7f9;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --grund: #15181c;
      --schrift: #e8eaed;
      --gedaempft: #9aa4b0;
      --akzent: #fb923c;
      --linie: #2b3037;
      --kasten: #1d2127;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--grund);
    color: var(--schrift);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.65;
  }
  .rahmen { max-width: 52rem; margin: 0 auto; padding: 2rem 1rem 4rem; }
  header.kopf { border-bottom: 1px solid var(--linie); margin-bottom: 2rem; }
  header.kopf .rahmen { padding-bottom: 1rem; padding-top: 1.25rem; }
  header.kopf a { color: var(--gedaempft); text-decoration: none; font-size: 0.9rem; }
  header.kopf a:hover { color: var(--akzent); }
  h1 { font-size: 1.9rem; line-height: 1.25; margin: 0 0 1rem; }
  h2 { font-size: 1.35rem; margin: 2.5rem 0 0.75rem; }
  h3 { font-size: 1.1rem; margin: 2rem 0 0.5rem; }
  a { color: var(--akzent); }
  code {
    background: var(--kasten);
    padding: 0.1em 0.35em;
    border-radius: 3px;
    font-size: 0.9em;
  }
  pre {
    background: var(--kasten);
    border: 1px solid var(--linie);
    border-radius: 6px;
    padding: 1rem;
    overflow-x: auto;
  }
  pre code { background: none; padding: 0; font-size: 0.85rem; }
  table { border-collapse: collapse; width: 100%; }
  th, td { border: 1px solid var(--linie); padding: 0.4rem 0.6rem; text-align: left; }
  blockquote {
    border-left: 3px solid var(--akzent);
    margin: 1rem 0;
    padding: 0.25rem 0 0.25rem 1rem;
    color: var(--gedaempft);
  }
  ul.loesungen { list-style: none; padding: 0; }
  ul.loesungen li {
    border: 1px solid var(--linie);
    border-radius: 6px;
    padding: 0.9rem 1.1rem;
    margin-bottom: 0.75rem;
  }
  ul.loesungen li a { font-weight: 600; text-decoration: none; }
  ul.loesungen li a:hover { text-decoration: underline; }
  ul.loesungen li p { margin: 0.35rem 0 0; color: var(--gedaempft); font-size: 0.95rem; }
  footer.fuss {
    border-top: 1px solid var(--linie);
    margin-top: 3rem;
    padding-top: 1rem;
    color: var(--gedaempft);
    font-size: 0.9rem;
  }
</style>
</head>
<body>
<header class="kopf">
  <div class="rahmen">
    <a href="{{ '/' | relative_url }}">{{ site.title }}</a>
  </div>
</header>
<main class="rahmen">
  {% if page.title %}<h1>{{ page.title }}</h1>{% endif %}
  {{ content }}
  <footer class="fuss">
    <p>
      Diese Seite entsteht aus dem Branch <code>{{ site.loesungs_branch | default: 'loesung/…' }}</code> des Repositorys
      <a href="https://github.com/atvantage-academy/code-template-docker-basics">code-template-docker-basics</a>.
      Dort zeigt zu jeder Übung ein Pull Request genau das, was sie hinzufügt.
    </p>
  </footer>
</main>
</body>
</html>
