# Veröffentlicht die Musterlösungen als GitHub Pages.
#
# Hintergrund: Bei manchen Kunden ist github.com gesperrt, github.io aber nicht.
# Die Lösungen müssen deshalb auch ohne Zugriff auf Pull Requests lesbar sein.
#
# Gebaut wird aus EINEM Branch – der Spitze der Lösungskette. Weil jeder
# Lösungsbranch auf dem der vorigen Übung aufbaut, enthält der letzte alle
# Ordner. Der Rahmen (Layout, Startseite, dieses Skript) liegt auf main.

name: Musterlösungen veröffentlichen

# Dieser Workflow liegt NUR auf main – die Lösungsbranches tragen keine
# Infrastruktur. Welcher von ihnen gebaut wird, sucht er sich selbst: den
# Branch, auf dem alle anderen aufbauen (.github/spitze-ermitteln.sh). Eine neue
# Übung braucht hier also keine Änderung.
#
# Ein Push auf einen Lösungsbranch löst allerdings NICHTS aus: Bei
# push-Ereignissen nimmt GitHub die Workflow-Dateien des gepushten Branches, und
# dort liegt diese hier nicht. Deshalb die drei Auslöser unten – und nach einer
# Änderung an den Lösungen am besten von Hand anstoßen:
#
#   gh workflow run pages.yml
on:
  push:
    branches:
      - main
  schedule:
    # Einmal täglich, damit die Seiten den Lösungsbranches auch ohne
    # Zutun folgen. Wer das nicht will, streicht diesen Auslöser.
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      branch:
        description: "Abweichender Lösungsbranch (leer = der konfigurierte)"
        required: false
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

# Eine Veröffentlichung zur Zeit, und laufende nicht abbrechen.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  bauen:
    runs-on: ubuntu-latest
    steps:
      - name: Rahmen holen
        uses: actions/checkout@v4
        with:
          # Immer von main – der Auslöser kann auch ein Lösungsbranch sein,
          # und der kennt weder Layout noch Startseite.
          ref: main

      - name: Lösungen holen
        uses: actions/checkout@v4
        with:
          # Die ganze Historie und alle Branches: Daraus ergeben sich die
          # Spitze der Kette und die Reihenfolge der Module.
          fetch-depth: 0
          path: .loesungen

      - name: Spitze der Lösungskette bestimmen
        id: kette
        run: |
          # Sicherstellen, dass ALLE Lösungsbranches als Referenzen vorliegen –
          # worauf checkout sie beschränkt, hängt an seiner Fassung.
          git -C .loesungen fetch --quiet --prune origin \
            "+refs/heads/loesung/*:refs/remotes/origin/loesung/*"

          branch="${{ github.event.inputs.branch }}"
          if [ -z "$branch" ]; then
            branch="$(.github/spitze-ermitteln.sh .loesungen)"
          fi
          echo "Gebaut wird aus: $branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          git -C .loesungen checkout --quiet "$branch"

      - name: Seiten aus den Lösungsordnern erzeugen
        run: |
          python3 .github/seiten-erzeugen.py .loesungen . \
            "${{ steps.kette.outputs.branch }}"

      - name: Pages vorbereiten
        uses: actions/configure-pages@v5

      - name: Jekyll bauen
        uses: actions/jekyll-build-pages@v1

      - name: Ergebnis hochladen
        uses: actions/upload-pages-artifact@v3

  veroeffentlichen:
    needs: bauen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.veroeffentlichung.outputs.page_url }}
    steps:
      - name: Auf GitHub Pages ausliefern
        id: veroeffentlichung
        uses: actions/deploy-pages@v4
