# Der freiwillige Teil: wirklich warten statt nur starten.
# Aufruf:  docker compose -f compose.yaml -f compose.healthcheck.yaml up -d
services:

  datenbank:
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kurs -d helloworld"]
      interval: 5s
      retries: 10

  webapp:
    depends_on:
      datenbank:
        condition: service_healthy
